<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Mailer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --bg-dark: #07070a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-1: #7c3aed; /* Purple */
            --accent-2: #2563eb; /* Blue */
            --accent-3: #06b6d4; /* Cyan */
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- HEAVY CSS BACKGROUND AURORA --- */
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 20s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 500px; height: 500px;
            background: var(--accent-1);
            top: -150px; left: -100px;
        }

        .blob-2 {
            width: 600px; height: 600px;
            background: var(--accent-2);
            bottom: -200px; right: -150px;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 400px; height: 400px;
            background: var(--accent-3);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
            opacity: 0.3;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -50px) scale(1.1); }
            100% { transform: translate(-30px, 30px) scale(0.95); }
        }

        /* --- GLASSMORPHISM MAIN CARD --- */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }

        /* Subtle inner glow for the card */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
            transform: translateZ(30px); /* 3D pop out effect */
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4);
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            stroke: white;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
        }

        /* --- FORM FIELDS --- */
        .form-group {
            margin-bottom: 24px;
            transform: translateZ(20px);
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(161, 161, 170, 0.5);
        }

        .form-input:focus,
        .form-textarea:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        /* --- INTERACTIVE BUTTON --- */
        .btn-wrapper {
            transform: translateZ(50px); /* Pop out even more */
            margin-top: 32px;
        }

        .send-btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: transparent; /* We use inner divs for backgrounds */
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: color 0.3s;
        }

        .btn-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            z-index: 1;
            border-radius: 14px;
        }

        .btn-glow {
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--accent-3), var(--accent-1), var(--accent-2));
            z-index: 0;
            border-radius: 16px;
            opacity: 0;
            filter: blur(12px);
            transition: opacity 0.3s;
        }

        .btn-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-content svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            display: none;
            position: relative;
            z-index: 2;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .send-btn.loading .spinner { display: block; }
        .send-btn.loading .btn-content { display: none; }

        /* --- STATUS MESSAGE --- */
        .status-msg {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            font-weight: 500;
            height: 20px;
            opacity: 0;
            transform: translateY(10px);
        }

        .status-msg.success { color: var(--success); }
        .status-msg.error { color: var(--error); }

        /* --- RESPONSIVE --- */
        @media (max-width: 500px) {
            .glass-card {
                padding: 32px 24px;
            }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- Background Aurora -->
    <div class="aurora-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <div class="glass-card" id="glassCard">
            <div class="header">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <h1>Direct Mailer</h1>
                <p class="subtitle">Send a secure message directly to the administrator.</p>
            </div>

            <form id="emailForm">
                <div class="form-group">
                    <label class="form-label" for="nameInput">Your Name</label>
                    <input 
                        type="text" 
                        id="nameInput" 
                        class="form-input" 
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="messageInput">Message</label>
                    <textarea 
                        id="messageInput" 
                        class="form-textarea" 
                        placeholder="Type your message here..."
                        required
                    ></textarea>
                </div>

                <div class="btn-wrapper">
                    <button type="submit" class="send-btn" id="sendBtn">
                        <div class="btn-glow" id="btnGlow"></div>
                        <div class="btn-bg" id="btnBg"></div>
                        <div class="btn-content" id="btnContent">
                            <span>Send Message</span>
                            <svg viewBox="0 0 24 24">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </div>
                        <div class="spinner" id="spinner"></div>
                    </button>
                </div>
            </form>

            <div class="status-msg" id="statusMsg"></div>
        </div>
    </div>

    <script>

        const RECIPIENT_EMAIL = "choudharyu2003@gmail.com"; 

        const emailForm = document.getElementById('emailForm');
        const nameInput = document.getElementById('nameInput');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusMsg = document.getElementById('statusMsg');

        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (sendBtn.classList.contains('loading')) return;


            const userName = nameInput.value.trim();
            const userMessage = messageInput.value.trim();

            if (!userName || !userMessage) {
                showStatus("❌ Please fill in all fields", "error");
                return;
            }

            sendBtn.classList.add('loading');
            gsap.to(statusMsg, { opacity: 0, y: 10, duration: 0.2 });

            const emailData = {
                name: userName,
                email: "noreply@system.local",
                message: userMessage,
                _subject: `New Message from ${userName}`,
                _captcha: "false",
                _template: "table"
            };

            try {
                const response = await fetch(`https://formsubmit.co/ajax/${RECIPIENT_EMAIL}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                });

                const data = await response.json();

                if (data.success === "true" || data.success === true) {
                    showStatus("✅ Message delivered successfully!", "success");
                    emailForm.reset(); 
                } else {
                    showStatus("❌ Failed to send. (Check if email is activated)", "error");
                }
            } catch (error) {
                showStatus("❌ Network error. Please try again.", "error");
            } finally {

                sendBtn.classList.remove('loading');
            }
        });

        function showStatus(text, type) {
            statusMsg.textContent = text;
            statusMsg.className = `status-msg ${type}`;
            gsap.to(statusMsg, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)" });
            

            gsap.to(statusMsg, { opacity: 0, y: -10, duration: 0.3, delay: 4 });


        const glassCard = document.getElementById('glassCard');
        const btnGlow = document.getElementById('btnGlow');
        const btnBg = document.getElementById('btnBg');
        const btnContent = document.getElementById('btnContent');
        const btnArrow = btnContent.querySelector('svg');

        let cardTiltX = gsap.quickTo(glassCard, "rotateX", { duration: 0.6, ease: "power3" });
        let cardTiltY = gsap.quickTo(glassCard, "rotateY", { duration: 0.6, ease: "power3" });

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            
            cardTiltX(yAxis);
            cardTiltY(xAxis);
        });

        document.addEventListener('mouseleave', () => {
            gsap.to(glassCard, { rotateX: 0, rotateY: 0, duration: 0.8, ease: "elastic.out(1, 0.5)" });
        });


        const btnHoverTL = gsap.timeline({ paused: true });

        btnHoverTL
            .to(btnGlow, { opacity: 0.8, duration: 0.4, ease: "power2.out" }, 0)
            .to(btnBg, { 
                scale: 1.02, 
                background: `linear-gradient(135deg, ${getComputedStyle(document.documentElement).getPropertyValue('--accent-3')}, ${getComputedStyle(document.documentElement).getPropertyValue('--accent-1')})`,
                duration: 0.4, 
                ease: "power2.out" 
            }, 0)
            .to(btnArrow, { x: 6, rotation: -15, duration: 0.3, ease: "back.out(2)" }, 0)
            .to(sendBtn, { scale: 1.03, duration: 0.4, ease: "power2.out" }, 0);

        sendBtn.addEventListener('mouseenter', () => {
            btnHoverTL.play();
        });

        sendBtn.addEventListener('mouseleave', () => {
            btnHoverTL.reverse();
        });

        sendBtn.addEventListener('mousemove', (e) => {
            const rect = sendBtn.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            gsap.to(sendBtn, {
                x: x * 0.15,
                y: y * 0.15,
                duration: 0.4,
                ease: "power3.out"
            });
        });

        sendBtn.addEventListener('mouseleave', () => {
            gsap.to(sendBtn, {
                x: 0,
                y: 0,
                duration: 0.6,
                ease: "elastic.out(1, 0.4)"
            });
        });

        const formInputs = document.querySelectorAll('.form-input, .form-textarea');
        
        formInputs.forEach(input => {
            input.addEventListener('focus', () => {
                gsap.to(input, {
                    scale: 1.01,
                    duration: 0.3,
                    ease: "power2.out"
                });
            });

            input.addEventListener('blur', () => {
                gsap.to(input, {
                    scale: 1,
                    duration: 0.3,
                    ease: "power2.out"
                });
            });
        });

        window.addEventListener('load', () => {
            gsap.from(".icon-wrapper", { scale: 0, rotation: -180, duration: 1, ease: "back.out(1.7)", delay: 0.2 });
            gsap.from("h1", { y: 30, opacity: 0, duration: 0.8, ease: "power3.out", delay: 0.4 });
            gsap.from(".subtitle", { y: 20, opacity: 0, duration: 0.8, ease: "power3.out", delay: 0.5 });
            gsap.from(".form-group", { 
                y: 30, 
                opacity: 0, 
                duration: 0.8, 
                ease: "power3.out", 
                stagger: 0.15,
                delay: 0.6 
            });
            gsap.from(".btn-wrapper", { y: 40, opacity: 0, duration: 1, ease: "power3.out", delay: 0.9 });
        });
    }
    </script>
</body>
</html>
